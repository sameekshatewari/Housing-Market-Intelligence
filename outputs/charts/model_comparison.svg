<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a">Holdout model error comparison</text><text x="40" y="133" font-family="Arial" font-size="16" fill="#334155">Linear regression</text><rect x="250" y="105" width="346.5" height="32" rx="5" fill="#2563eb"/><rect x="250" y="144" width="407.2" height="32" rx="5" fill="#f97316"/><text x="780" y="127" font-family="Arial" font-size="13" fill="#0f172a">8,506</text><text x="780" y="166" font-family="Arial" font-size="13" fill="#0f172a">9,995</text><text x="40" y="243" font-family="Arial" font-size="16" fill="#334155">Random forest</text><rect x="250" y="215" width="370.4" height="32" rx="5" fill="#2563eb"/><rect x="250" y="254" width="427.0" height="32" rx="5" fill="#f97316"/><text x="780" y="237" font-family="Arial" font-size="13" fill="#0f172a">9,093</text><text x="780" y="276" font-family="Arial" font-size="13" fill="#0f172a">10,481</text><text x="40" y="353" font-family="Arial" font-size="16" fill="#334155">Gradient boosting</text><rect x="250" y="325" width="476.7" height="32" rx="5" fill="#2563eb"/><rect x="250" y="364" width="520.0" height="32" rx="5" fill="#f97316"/><text x="780" y="347" font-family="Arial" font-size="13" fill="#0f172a">11,702</text><text x="780" y="386" font-family="Arial" font-size="13" fill="#0f172a">12,764</text><rect x="300" y="455" width="18" height="18" fill="#2563eb"/><text x="326" y="470" font-family="Arial" font-size="14" fill="#334155">MAE (lower is better)</text><rect x="535" y="455" width="18" height="18" fill="#f97316"/><text x="561" y="470" font-family="Arial" font-size="14" fill="#334155">RMSE (lower is better)</text><text x="250" y="500" font-family="Arial" font-size="12" fill="#64748b">Error in price units</text></svg>